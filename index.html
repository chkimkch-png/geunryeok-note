<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근력노트">
<title>근력노트</title>
<style>
:root{--navy:#1F2A44;--orange:#FF7A00;--bg:#F4F5F8;--card:#fff;--line:#DDE1E8;--text:#1b1f2a;--sub:#6b7385}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:17px;padding-bottom:84px}
#top{position:sticky;top:0;z-index:5}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#today{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
header h1{margin:0;font-size:20px}
header span{font-size:13px;color:#c9d0e0}
main{padding:0 14px 14px;max-width:560px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input,select{width:100%;padding:13px 12px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.meta{font-size:14px;color:var(--sub);margin-top:6px}
.sets{background:var(--card);border-radius:12px;padding:10px;margin-top:12px;border:1px solid var(--line)}
.sh,.sr{display:grid;grid-template-columns:54px 1fr 1fr;gap:8px;align-items:center}
.sh{font-size:12px;color:var(--sub);margin-bottom:4px}
.sr{margin-bottom:8px}.sr b{color:var(--navy)}
#live{margin-top:14px;padding:12px;background:#fff3e6;border-radius:10px;color:#8a4300;font-size:15px}
button{font-size:17px;border:0;border-radius:12px;padding:14px;width:100%;margin-top:12px;font-weight:600}
.primary{background:var(--orange);color:#fff}
.ghost{background:#e9ecf3;color:var(--navy)}
.danger{background:#fde8e8;color:#b42318}
.small{width:auto;padding:8px 12px;font-size:14px;margin:0}
.selbtn{display:flex;justify-content:space-between;align-items:center;margin:0;padding:13px 12px;font-size:17px;font-weight:400;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);min-height:50px}
.selbtn:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.selbtn i{font-style:normal;color:var(--sub);margin-left:8px}
.pk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.pk[hidden]{display:none}
.pkb{background:#fff;width:100%;max-width:560px;max-height:75vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.pkh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy);font-size:16px}
.pkh .pkx{margin-left:auto}
.pkl{overflow-y:auto;-webkit-overflow-scrolling:touch}
.pkl button{display:block;width:100%;margin:0;border-radius:0;background:#fff;color:var(--text);text-align:left;font-weight:500;padding:16px;border-bottom:1px solid var(--line);border-left:5px solid transparent}
.pkl button.on{background:#fff4e6;border-left-color:var(--orange);color:var(--navy);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;border-radius:0;background:#fff;color:var(--sub);padding:14px 4px;font-size:15px}
nav button.on{color:var(--orange);border-top:3px solid var(--orange);padding-top:11px}
h3{margin:18px 2px 6px;font-size:15px;color:var(--navy);display:flex;justify-content:space-between}
h3 em{font-style:normal;color:var(--sub);font-weight:400;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.card .t{display:flex;justify-content:space-between;font-weight:700}
.card .t small{color:var(--sub);font-weight:400}
.card .d{font-size:14px;color:#444;margin-top:4px;line-height:1.5}
.card .del{float:right}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
th{background:var(--navy);color:#fff;font-weight:500;padding:9px 6px;text-align:right}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
td b{color:var(--orange)}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.note{font-size:13px;color:var(--sub);line-height:1.5;margin-top:6px}

#ibar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);align-items:stretch}
#ibar button{margin:0;padding:0 9px;min-height:52px;font-size:14px;border-radius:10px;width:auto;white-space:nowrap}
.lrow{display:flex;justify-content:space-between;align-items:flex-end}.lrow label{margin-bottom:6px}
#btnCnt{width:auto;min-width:92px;min-height:62px;margin:8px 0 4px;padding:2px 16px;font-size:40px;font-weight:800;line-height:1.1;border-radius:14px;background:var(--navy);color:#fff;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#btnCnt.max{background:var(--orange)}
.iv-run{min-width:68px}
.iv-save{min-width:48px;background:var(--navy);color:#fff}
.iv-btn{background:#e9ecf3;color:var(--navy)}
.iv-run{background:var(--orange);color:#fff}
.iv-run.on{background:#b42318}
.ibox{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:row;align-items:center;justify-content:center;min-height:52px;background:#f8f9fc;line-height:1.25;padding:0 6px;min-width:0}
.ic{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1 1 auto;min-width:0;white-space:nowrap}
.ie{border-left:1px solid var(--line);margin-left:6px;padding-left:6px;flex:0 0 auto}
.ie b{font-size:16px}
.ibox b{font-size:17px;color:var(--navy)}
.ibox small{font-size:12px;color:var(--sub)}
.ibox.run{border-color:var(--orange);background:#fff8f0}
.ibox.run #istate,.ibox.run #iacc{color:#c25e00;font-weight:700}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 2px 4px}
.opt{background:#e9ecf3;color:var(--navy);margin-top:8px}
.opt.sel{background:var(--navy);color:#fff}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fbar{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-bottom:4px}
.fbar.one{grid-template-columns:1fr}
.fbar select{padding:11px 10px;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#e4e8f0;padding:4px;border-radius:12px}
.seg button{margin:0;padding:10px 0;font-size:15px;border-radius:9px;background:transparent;color:var(--sub);width:100%}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.pnav button{width:48px;margin:0;padding:8px 0;font-size:18px;background:#e9ecf3;color:var(--navy)}
.pnav button:disabled{opacity:.3}
.pnav b{font-size:16px;color:var(--navy)}
.sumcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.sc small{display:block;color:var(--sub);font-size:12px}
.sc b{display:block;font-size:17px;color:var(--navy);margin:3px 0 2px;white-space:nowrap}
.dl{font-size:12px;font-weight:700;white-space:nowrap}
.dl.up{color:#1a7f37}.dl.down{color:#b42318}.dl.same{color:var(--sub)}.dl.new{color:#0b69c7}
.brow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.brow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brow .bn{font-weight:700}
.brow .bn small{color:var(--sub);font-weight:400;margin-left:6px;font-size:12px}
.btrack{background:#eceef4;border-radius:6px;height:12px;overflow:hidden}
.brow>.btrack{margin:8px 0 4px}
.bfill{height:100%;border-radius:6px}
.bfill.s{background:var(--navy)}.bfill.c{background:var(--orange)}.bfill.g{background:#b9c0cf}
.bsub{font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:4px}
.bsub i{font-style:normal;color:#98a0b2}
.cr{display:grid;grid-template-columns:66px 1fr 82px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.cr .cl{color:var(--sub);font-size:12px}
.cr .cv{text-align:right;color:var(--navy)}
.tl{display:flex;align-items:flex-end;gap:4px;height:112px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px}
.tcol{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.tbar{width:70%;border-radius:4px 4px 0 0}
.tbar.s{background:var(--navy)}.tbar.c{background:var(--orange)}
.tval{font-size:10px;color:var(--sub);margin-bottom:2px;white-space:nowrap}
.tlab{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
#toast.show{opacity:1}
/* ===== 입력 탭: 스크롤 없이 한 화면 (남는 세로 공간은 세트 입력표가 채움) ===== */
body.fit{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:var(--navH,56px)}
body.fit main{flex:1 1 auto;min-height:0;width:100%;max-width:560px;align-self:center;margin:0;padding:4px 10px 6px;overflow-y:auto}
#tab-in.active{display:grid;height:100%;grid-template-columns:minmax(0,1fr) 92px;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:6px 8px}
#strength,#cardio{display:contents}
#tab-in label{margin:0 0 2px;font-size:12px;line-height:14px}
#tab-in input{height:38px;padding:0 10px;font-size:16px}
#tab-in .f{min-width:0}
#tab-in .d1{grid-column:1;grid-row:1;align-self:end}
#btnCnt{grid-column:2;grid-row:1;height:54px;width:100%;min-width:0;margin:0;padding:0 6px;font-size:40px;line-height:1}
#tab-in .d2{grid-column:1;grid-row:2;align-self:end}
#tab-in #btnLast{grid-column:2;grid-row:2/4;height:100%;margin:0;padding:0 4px;font-size:14px;line-height:1.3}
#tab-in .lr{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;height:18px;margin-bottom:3px}
#tab-in .lr label{margin:0;flex:none}
#tab-in .lr .meta{margin:0;font-size:12px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#tab-in .selbtn{height:40px;min-height:40px;padding:0 10px;font-size:16px}
#tab-in .base,#tab-in .cg{grid-column:1;grid-row:3;align-self:end}
#tab-in .cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tab-in .sets{grid-column:1/-1;grid-row:4;margin:0;padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
#tab-in .sh{flex:none;margin:0;height:14px;font-size:11px;grid-template-columns:44px 1fr 1fr;gap:6px}
#tab-in .sr{flex:1 1 0;min-height:30px;max-height:72px;margin:0;grid-template-columns:44px 1fr 1fr;gap:6px}
#tab-in .sr input{height:100%;padding:0 10px;font-size:16px}
#tab-in .sr b{font-size:14px}
#tab-in .memo{grid-column:1/-1;grid-row:5}
body.cd #tab-in .memo{grid-row:4;align-self:start}
#tab-in .bot{grid-column:1/-1;grid-row:6;display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px;align-items:stretch}
body.cd #tab-in .bot{grid-row:5}
#tab-in #live{margin:0;padding:6px 10px;font-size:13px;line-height:1.25;display:flex;align-items:center}
#tab-in #btnSave{margin:0;height:46px;padding:0}
/* ===== 스크롤해도 상단 고정 (기록·누적·점검·설정) ===== */
.stk{position:sticky;top:var(--topH,120px);z-index:4;background:var(--bg);margin:0 -14px;padding:4px 14px 4px;box-shadow:0 3px 4px -3px rgba(0,0,0,.18)}
#tab-set>h3:first-child{position:sticky;top:var(--topH,120px);z-index:4;background:var(--bg);margin:0 -14px;padding:8px 14px 6px;box-shadow:0 3px 4px -3px rgba(0,0,0,.18);align-items:center}
#tab-list .fbar,#tab-sum .fbar{margin-bottom:0}
#tab-list .meta{margin-top:4px;font-size:13px}
#tab-chk .seg button{padding:7px 0}
#tab-chk h3{margin:6px 2px 4px}
#tab-chk .pnav{margin:6px 0 2px}
#tab-chk .pnav button{padding:4px 0}
#tab-chk .sumcards{margin:4px 0 2px;gap:6px}
#tab-chk .sc{padding:5px 4px}
#tab-chk .sc b{margin:1px 0}
#tab-chk .sc br{display:none}
#tab-chk .sc .dl{display:block}
#tab-chk .meta{margin-top:2px;font-size:12px}
/* ===== 카운트다운 큰 화면 + 시·분·초 입력 ===== */
#tab-in .cg{grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr)}
#tab-in .t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
#tab-in .t3 input{padding:0 2px;text-align:center}
.cdpop{grid-column:1;grid-row:1/4;z-index:5;background:var(--navy);color:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.cdpop[hidden]{display:none}
.cdpop.warn{background:#C62828}
.cdpop .cdl{font-size:14px;font-weight:700;opacity:.85;line-height:1.2}
#cdNum{font-size:clamp(56px,23vw,104px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-1px}
body.cd .cdpop{grid-row:1/3}
</style>
</head>
<body class="fit">
<div id="top">
<header><h1>근력노트</h1><span id="today"></span><span id="sub"></span></header>
<div id="ibar">
  <button id="btnIv" class="iv-btn" type="button">⏱ 반복시간</button>
  <div id="ibox" class="ibox" aria-live="off"><div class="ic"><b id="ival">1분</b><small id="istate">대기 중</small></div><div class="ic ie"><small>누적</small><b id="iacc">0:00</b></div></div>
  <button id="btnRun" class="iv-run" type="button" aria-pressed="false">▶ 시작</button>
  <button id="btnSaveT" class="iv-save" type="button">저장</button>
</div>
</div>
<main>

<section class="tab active" id="tab-in">
  <div id="cdPop" class="cdpop" hidden><div class="cdl">남은 시간</div><div id="cdNum">00:00</div></div>
  <div class="f d1"><label for="date">날짜</label><input type="date" id="date"></div>
  <button type="button" id="btnCnt" aria-label="세트 카운터">0</button>

  <div class="f d2">
    <div class="lr"><label for="exBtn">운동 종목</label><span class="meta" id="meta"></span></div>
    <button type="button" id="exBtn" class="selbtn" aria-haspopup="dialog"><span id="exBtnTxt"></span><i>▾</i></button>
  </div>
  <button class="ghost" id="btnLast">지난번 기록<br>불러오기</button>
  <select id="ex" hidden></select>
  <datalist id="partList"></datalist>

  <div id="strength">
    <div class="f base"><label for="base">기본무게(kg)</label><input id="base" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0=맨몸"></div>
    <div class="sets" id="sets">
      <div class="sh"><span></span><span>횟수</span><span>무게(kg)·다를 때만</span></div>
    </div>
  </div>

  <div id="cardio" hidden>
    <div class="cg">
      <div class="f"><label for="dist">거리 (km)</label><input id="dist" type="number" inputmode="decimal" step="0.01" min="0" placeholder="예: 5.2"></div>
      <div class="f"><label for="dh">시간 (시 · 분 · 초)</label><div class="t3"><input id="dh" type="number" inputmode="numeric" min="0" placeholder="시"><input id="dm" type="number" inputmode="numeric" min="0" placeholder="분"><input id="ds" type="number" inputmode="numeric" min="0" placeholder="초"></div></div>
    </div>
  </div>

  <div class="f memo"><label for="memo">비고</label><input id="memo" type="text" placeholder="컨디션, 메모 등"></div>
  <div class="bot"><div id="live"></div><button class="primary" id="btnSave">저장</button></div>
</section>

<section class="tab" id="tab-list">
  <div class="stk">
  <div class="fbar">
    <select id="fEx" aria-label="종목 선택"></select>
    <select id="fSort" aria-label="정렬">
      <option value="new">최신순</option>
      <option value="old">오래된순</option>
      <option value="name">종목명순</option>
      <option value="amt">운동량 많은순</option>
    </select>
  </div>
  <div class="meta" id="listMeta"></div>
  </div>
  <div id="list"></div>
</section>

<section class="tab" id="tab-sum">
  <div class="stk">
  <div class="fbar one">
    <select id="sSort" aria-label="누적 정렬">
      <option value="amt">누적량 많은순</option>
      <option value="name">종목명순</option>
      <option value="recent">최근 운동순</option>
      <option value="days">운동일 많은순</option>
    </select>
  </div>
  </div>
  <div id="sum"></div>
</section>
<section class="tab" id="tab-chk"><div id="chkBody"></div></section>

<section class="tab" id="tab-set">
  <h3>운동 종목 관리<button type="button" class="ghost small ordbtn"></button></h3>
  <div id="exlist"></div>
  <label for="nn">새 종목 이름</label><input id="nn" type="text" placeholder="예: 데드리프트">
  <label for="np">부위</label><input id="np" type="text" list="partList" placeholder="예: 등 (유산소는 '유산소')">
  <label for="nt">유형</label>
  <select id="nt"><option>근력</option><option>유산소</option></select>
  <button class="ghost" id="btnAddEx">종목 추가</button>

  <h3>구글 시트 자동 전송 (선택)</h3>
  <label for="url">Apps Script 웹앱 주소</label>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="ghost" id="btnUrl">주소 저장</button>
  <button class="ghost" id="btnResend">전체 다시 보내기 (중복은 시트에서 제외)</button>
  <div class="note" id="syncNote"></div>

  <h3>백업 / 복원</h3>
  <button class="ghost" id="btnCsv">CSV로 내보내기</button>
  <button class="ghost" id="btnImp">CSV 가져오기</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
  <div class="note">기록은 이 휴대폰의 브라우저에 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 CSV로 백업하세요.</div>
  <button class="danger" id="btnClear">전체 기록 삭제</button>
</section>

</main>

<nav>
  <button data-t="in" class="on">입력</button>
  <button data-t="list">기록</button>
  <button data-t="sum">누적</button>
  <button data-t="chk">점검</button>
  <button data-t="set">설정</button>
</nav>
<div id="ivSheet" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="반복시간 선택">
    <h3>반복시간 선택</h3>
    <div id="ivOpts"></div>
    <div id="ivManual" hidden>
      <div class="mrow">
        <div><label for="ivM">분 (0~60)</label><input id="ivM" type="number" inputmode="numeric" min="0" max="60" placeholder="0"></div>
        <div><label for="ivS">초 (0~59)</label><input id="ivS" type="number" inputmode="numeric" min="0" max="59" placeholder="45"></div>
      </div>
      <button class="primary" id="ivOk" type="button">확인</button>
    </div>
    <button class="ghost" id="ivClose" type="button">닫기</button>
  </div>
</div>
<div id="exPick" class="pk" hidden>
  <div class="pkb" role="dialog" aria-label="운동 종목 선택">
    <div class="pkh"><span>정렬</span><button type="button" class="ghost small ordbtn"></button><button type="button" class="ghost small pkx" id="pkClose">닫기</button></div>
    <div class="pkl" id="pkList"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var KEY='geunryeok_note_v1';
var DEF=[{n:'벤치프레스',p:'가슴',t:'근력'},{n:'랫풀다운',p:'등',t:'근력'},{n:'스쿼트',p:'하체',t:'근력'},{n:'숄더프레스',p:'어깨',t:'근력'},{n:'빨리걷기',p:'유산소',t:'유산소'},{n:'러닝',p:'유산소',t:'유산소'}];
var state={ex:DEF,rec:[],url:'',pend:0,pendMap:{}};
var $=function(i){return document.getElementById(i)};

function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o.ex)state.ex=o.ex;if(o.rec)state.rec=o.rec;if(o.pend>0)state.pend=o.pend;if(o.pendMap)state.pendMap=o.pendMap;
if(o.tm&&o.tm.length){   /* 이전 버전에서 따로 저장한 운동시간 → 같은 날(또는 그 이전) 가장 최근 운동 기록에 붙임 */
  o.tm.forEach(function(t){var b=null;state.rec.forEach(function(r){if(r.date<=t.date&&(!b||r.date>b.date||(r.date===b.date&&r.ts>b.ts)))b=r});if(b)b.sec=(b.sec||0)+t.sec});
  setTimeout(save,0);
}if(o.url)state.url=o.url;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('저장 공간을 쓸 수 없습니다. CSV로 백업하세요');return false}}
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2200)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)||n<0?0:n}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('ko-KR')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function calc(reps,w,base){var sets=0,vol=0;for(var i=0;i<5;i++){if(reps[i]>0){sets++;vol+=reps[i]*(w[i]>0?w[i]:base)}}return{sets:sets,vol:vol}}
function findEx(n){if(!n)return null;for(var i=0;i<state.ex.length;i++)if(state.ex[i].n===n)return state.ex[i];return null}

/* 세트 입력칸 만들기 */
var setsBox=$('sets');
for(var i=0;i<5;i++){
  var r=document.createElement('div');r.className='sr';
  r.innerHTML='<b>'+(i+1)+'세트</b><input type="number" inputmode="numeric" min="0" id="r'+i+'" placeholder="횟수"><input type="number" inputmode="decimal" step="0.5" min="0" id="w'+i+'" placeholder="기본">';
  setsBox.appendChild(r);
}

function renderEx(keep){
  var sel=$('ex'),cur=keep||sel.value;sel.innerHTML='';
  state.ex.filter(function(e){return e.n}).sort(function(a,b){return exCmp(a.n,b.n)}).forEach(function(e){var o=document.createElement('option');o.value=e.n;o.textContent=e.n;sel.appendChild(o)});
  if(cur&&findEx(cur))sel.value=cur;
  onEx();
  if(!$('exPick').hidden)renderPick();
}
function updateExBtn(){var v=$('ex').value;$('exBtnTxt').textContent=v||'종목을 선택하세요'}
function renderPick(){
  var sel=$('ex'),box=$('pkList');box.innerHTML='';
  for(var i=0;i<sel.options.length;i++){(function(o){
    var b=document.createElement('button');b.type='button';b.textContent=o.value;if(o.value===sel.value)b.className='on';
    b.onclick=function(){sel.value=o.value;onEx();closePick()};
    box.appendChild(b);
  })(sel.options[i])}
}
function openPick(){renderPick();$('exPick').hidden=false;var on=$('pkList').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'center'})}
function closePick(){$('exPick').hidden=true}
function onEx(){
  updateExBtn();
  var e=findEx($('ex').value);
  if(!e){$('meta').textContent='종목을 설정 탭에서 추가하세요';return}
  $('meta').textContent='부위: '+e.p+' · 유형: '+e.t;
  var c=e.t==='유산소';
  $('strength').hidden=c;$('cardio').hidden=!c;document.body.classList.toggle('cd',c);
  live();
}
function readForm(){
  var base=num($('base').value),reps=[],w=[];
  for(var i=0;i<5;i++){reps.push(num($('r'+i).value));w.push(num($('w'+i).value))}
  return{base:base,reps:reps,w:w};
}
function live(){
  var e=findEx($('ex').value),box=$('live');
  if(!e){box.textContent='';return}
  if(e.t==='유산소'){box.textContent='입력 거리: '+fmt(num($('dist').value))+' km'+(readDur()>0?' · 시간 '+tmKo(readDur()):'');return}
  var f=readForm(),c=calc(f.reps,f.w,f.base);
  box.textContent='수행 세트 '+c.sets+'개 · 운동량 '+fmt(c.vol)+' kg';
}
function rsec(r){return r.dsec>0?r.dsec:Math.round((r.min||0)*60)}   /* 유산소 시간(초): 새 기록은 dsec, 예전 기록은 분(min)에서 환산 */
function readDur(){var h=Math.floor(num($('dh').value)),m=Math.floor(num($('dm').value)),x=Math.floor(num($('ds').value));return Math.max(0,h*3600+m*60+x)}
function setDur(sec){$('dh').value=sec>=3600?Math.floor(sec/3600):'';$('dm').value=sec>=60?Math.floor(sec%3600/60):'';$('ds').value=sec>0?sec%60:''}
function clearForm(){
  $('base').value='';for(var i=0;i<5;i++){$('r'+i).value='';$('w'+i).value=''}
  $('dist').value='';setDur(0);$('memo').value='';live();
}

function lastOf(name){
  var best=null;
  state.rec.forEach(function(r){if(r.ex===name&&(!best||r.date>best.date||(r.date===best.date&&r.ts>best.ts)))best=r});
  return best;
}
function fillLast(){
  var r=lastOf($('ex').value);
  if(!r){toast('이 종목의 이전 기록이 없습니다');return}
  $('base').value=r.base||'';
  for(var i=0;i<5;i++){$('r'+i).value=r.reps[i]||'';$('w'+i).value=r.w[i]||''}
  $('dist').value=r.dist||'';setDur(rsec(r));live();
  toast(r.date+' 기록을 불러왔습니다');
}

function sheetRow(r){
  var row=[r.id,r.date,r.part,r.ex,r.base];
  for(var i=0;i<5;i++)row.push(r.reps[i]||'');
  for(i=0;i<5;i++)row.push(r.w[i]||'');
  row.push(r.dist||'',r.min||'',r.memo||'',r.sets,r.vol,r.sec>0?tmKo(r.sec):'');   /* U열: 운동시간 (예: 1분 20초) */
  return row;
}
function send(recs,quiet,upd){
  if(!state.url||!recs.length)return Promise.resolve(false);
  return fetch(state.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows:recs.map(sheetRow),update:!!upd})})
   .then(function(){recs.forEach(function(r){r.sent=true});save();renderList();if(!quiet)toast('시트로 전송을 요청했습니다');return true})
   .catch(function(){if(!quiet)toast('전송 실패 – 인터넷 연결을 확인하세요');return false});
}

function saveRec(){
  var e=findEx($('ex').value);
  if(!e){toast('종목을 선택하세요');return}
  var date=$('date').value;if(!date){toast('날짜를 입력하세요');return}
  var rec={id:newId(),ts:Date.now(),date:date,part:e.p,ex:e.n,type:e.t,base:0,reps:[0,0,0,0,0],w:[0,0,0,0,0],dist:0,min:0,memo:$('memo').value.trim(),sets:0,vol:0,sent:false};
  if(e.t==='유산소'){
    rec.dist=num($('dist').value);rec.dsec=readDur();rec.min=Math.round(rec.dsec/60*100)/100;
    if(!(rec.dist>0||rec.dsec>0)){toast('거리 또는 시간을 입력하세요');return}
  }else{
    var f=readForm();rec.base=f.base;rec.reps=f.reps;rec.w=f.w;
    var c=calc(f.reps,f.w,f.base);rec.sets=c.sets;rec.vol=c.vol;
    if(c.sets===0){toast('횟수를 한 세트 이상 입력하세요');return}
  }
  var gen=state.pend||0,bound=(state.pendMap&&state.pendMap[e.n])||0,used=gen+bound;
  if(used>0)rec.sec=used;
  state.rec.push(rec);state.pend=0;if(bound)delete state.pendMap[e.n];
  if(!save()){state.rec.pop();state.pend=gen;if(bound)state.pendMap[e.n]=bound;return}
  clearForm();toast(e.n+' 저장했습니다'+(used>0?' · 운동시간 '+tmKo(used)+' 포함':''));renderList();renderSum();
  send([rec],true);
}

/* ===== 보기 설정(필터·정렬) ===== */
var view={ex:'all',sort:'new',sum:'amt',exo:'asc'},VKEY='geunryeok_note_view_v1';
function loadView(){try{var v=JSON.parse(localStorage.getItem(VKEY));if(v){if(typeof v.ex==='string')view.ex=v.ex;if(typeof v.sort==='string')view.sort=v.sort;if(typeof v.sum==='string')view.sum=v.sum;if(v.exo==='asc'||v.exo==='desc')view.exo=v.exo}}catch(e){}}
function saveView(){try{localStorage.setItem(VKEY,JSON.stringify(view))}catch(e){}}
function recType(r){return r.type||(r.sets?'근력':'유산소')}
function recScore(r){return recType(r)==='유산소'?r.dist:r.vol}
function koCmp(a,b){return String(a).localeCompare(String(b),'ko')}
function exCmp(a,b){var c=koCmp(a,b);return view.exo==='desc'?-c:c}
function pkey(p){return String(p||'').replace(/\s+/g,'')}
function ordLabel(){var t=view.exo==='desc'?'▼ 내림차순':'▲ 오름차순';document.querySelectorAll('.ordbtn').forEach(function(b){b.textContent=t})}
function refreshParts(){var d=$('partList');if(!d)return;d.innerHTML='';var seen={};state.ex.forEach(function(e){var k=pkey(e.p);if(k&&!seen[k]){seen[k]=1;var o=document.createElement('option');o.value=e.p;d.appendChild(o)}})}
function cmpNew(a,b){return a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts}
function cmpOld(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts}
function matchView(r){
  var v=view.ex;
  if(v==='all')return true;
  if(v.indexOf('p:')===0)return pkey(r.part)===pkey(v.slice(2));
  return (r.ex||'')===v.slice(2);
}
/* 기록이 추가·삭제될 때마다 종목 목록을 기록에서 다시 만든다 */
function buildFilter(){
  var sel=$('fEx'),parts={},total=0;
  state.rec.forEach(function(r){
    var k=pkey(r.part),p=parts[k]||(parts[k]={n:0,ex:{},names:{}});
    p.n++;p.names[r.part||'']=(p.names[r.part||'']||0)+1;
    var en=r.ex||'';p.ex[en]=(p.ex[en]||0)+1;total++;
  });
  sel.innerHTML='';
  var o=document.createElement('option');o.value='all';o.textContent='전체 종목 ('+total+')';sel.appendChild(o);
  Object.keys(parts).sort(exCmp).forEach(function(k){
    var p=parts[k],label='(부위 없음)',best=0;
    Object.keys(p.names).forEach(function(nm){if(nm&&p.names[nm]>best){best=p.names[nm];label=nm}});
    var g=document.createElement('optgroup');g.label=label;
    var exn=Object.keys(p.ex);
    if(exn.length>1){var po=document.createElement('option');po.value='p:'+k;po.textContent=label+' 전체 ('+p.n+')';g.appendChild(po)}
    exn.sort(exCmp).forEach(function(en){
      var eo=document.createElement('option');eo.value='e:'+en;eo.textContent=(en||'(종목명 없음)')+' ('+p.ex[en]+')';g.appendChild(eo);
    });
    sel.appendChild(g);
  });
  if(view.ex.indexOf('p:')===0){var pk=parts[pkey(view.ex.slice(2))];if(pk){var ks=Object.keys(pk.ex);if(ks.length===1)view.ex='e:'+ks[0];else view.ex='p:'+pkey(view.ex.slice(2))}}
  sel.value=view.ex;
  if(sel.value!==view.ex){view.ex='all';sel.value='all'}
  $('fSort').value=view.sort;
}

function wd(d){return['일','월','화','수','목','금','토'][new Date(d+'T00:00:00').getDay()]}
function el(tag,cls,txt){var x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function recCard(r,showDate){
  var c=el('div','card');
  var t=el('div','t',r.ex);
  var info=(showDate?r.date+' ('+wd(r.date)+') · ':'')+r.part+(state.url?(r.sent?' · 전송요청됨':' · 미전송'):'');
  t.appendChild(el('small',null,info));
  c.appendChild(t);
  var txt;
  if(r.type==='유산소'||r.part==='유산소'&&!r.sets){txt='거리 '+fmt(r.dist)+'km'+(rsec(r)>0?' · '+tmKo(rsec(r)):'')}
  else{
    var parts=[];for(var i=0;i<5;i++)if(r.reps[i]>0)parts.push(r.reps[i]+'회×'+fmt(r.w[i]>0?r.w[i]:r.base)+'kg');
    txt=r.sets+'세트 · '+parts.join(' / ')+' · 운동량 '+fmt(r.vol)+'kg';
  }
  if(r.sec>0)txt+=' · 운동시간 '+tmKo(r.sec);
  if(r.memo)txt+=' · '+r.memo;
  c.appendChild(el('div','d',txt));
  var b=el('button','danger small del','삭제');
  b.onclick=function(){if(confirm('이 기록을 삭제할까요?\n(구글 시트에 이미 전송된 행은 시트에서 직접 지워야 합니다)')){state.rec=state.rec.filter(function(x){return x.id!==r.id});save();renderList();renderSum()}};
  c.appendChild(b);
  return c;
}
function renderList(){
  var box=$('list');box.innerHTML='';$('listMeta').textContent='';
  $('sub').textContent=state.rec.length+'건 기록';
  buildFilter();
  if(!state.rec.length){box.appendChild(el('p','empty','아직 기록이 없습니다.'));return}
  var arr=state.rec.filter(matchView);
  if(!arr.length){box.appendChild(el('p','empty','선택한 종목의 기록이 없습니다.'));return}
  var cmp=cmpNew;
  if(view.sort==='old')cmp=cmpOld;
  else if(view.sort==='name')cmp=function(a,b){return koCmp(a.ex,b.ex)||cmpNew(a,b)};
  else if(view.sort==='amt')cmp=function(a,b){
    var ta=recType(a)==='유산소'?1:0,tb=recType(b)==='유산소'?1:0;
    return ta-tb||recScore(b)-recScore(a)||cmpNew(a,b);
  };
  arr.sort(cmp);
  $('listMeta').textContent=arr.length+'건 표시'+(view.ex!=='all'?' (전체 '+state.rec.length+'건 중)':'')+(view.sort==='amt'?' · 근력은 운동량(kg), 유산소는 거리(km) 기준':'');
  if(view.sort==='new'||view.sort==='old'){
    var groups={},order=[];
    arr.forEach(function(r){if(!groups[r.date]){groups[r.date]=[];order.push(r.date)}groups[r.date].push(r)});
    order.forEach(function(d){
      var vol=0,dist=0,sc=0;groups[d].forEach(function(r){vol+=r.vol;dist+=r.dist;sc+=r.sec||0});
      var h=el('h3',null,d+' ('+wd(d)+')');
      h.appendChild(el('em',null,(vol?'운동량 '+fmt(vol)+'kg ':'')+(dist?'거리 '+fmt(dist)+'km ':'')+(sc?'운동시간 '+tmKo(sc):'')));
      box.appendChild(h);
      groups[d].forEach(function(r){box.appendChild(recCard(r,false))});
    });
  }else{
    arr.forEach(function(r){box.appendChild(recCard(r,true))});
  }
}

function renderSum(){
  var box=$('sum');
  $('sSort').value=view.sum;
  if(!state.rec.length){box.innerHTML='<p class="empty">기록이 쌓이면 누적이 표시됩니다.</p>';return}
  var m={};
  state.rec.forEach(function(r){
    var o=m[r.ex]||(m[r.ex]={days:{},cnt:0,sec:0,dsec:0,vol:0,dist:0,min:0,max:0,last:'',type:recType(r),part:r.part});
    o.days[r.date]=1;o.cnt++;o.sec+=r.sec||0;o.vol+=r.vol;o.dist+=r.dist;o.min+=r.min;o.dsec+=rsec(r);
    if(r.date>o.last)o.last=r.date;
    for(var i=0;i<5;i++){if(r.reps[i]>0){var w=r.w[i]>0?r.w[i]:r.base;if(w>o.max)o.max=w}}
  });
  var names=Object.keys(m),st=names.filter(function(n){return m[n].type!=='유산소'}),ca=names.filter(function(n){return m[n].type==='유산소'});
  var key=view.sum;
  function sorter(metric){return function(a,b){
    if(key==='name')return koCmp(a,b);
    if(key==='recent')return (m[a].last<m[b].last?1:m[a].last>m[b].last?-1:0)||koCmp(a,b);
    if(key==='days')return Object.keys(m[b].days).length-Object.keys(m[a].days).length||koCmp(a,b);
    return metric(m[b])-metric(m[a])||koCmp(a,b);
  }}
  st.sort(sorter(function(o){return o.vol}));
  ca.sort(sorter(function(o){return o.dist}));
  var h='',tv=0,td=0,tsv=0,tsc=0;
  if(st.length){
    h+='<h3>근력 운동</h3><table><tr><th>종목</th><th>운동일</th><th>최고무게</th><th>누적 운동량(kg)</th><th>운동시간</th></tr>';
    st.forEach(function(n){var o=m[n];tv+=o.vol;tsv+=o.sec;h+='<tr><td>'+esc(n)+'</td><td>'+Object.keys(o.days).length+'('+o.cnt+')</td><td>'+fmt(o.max)+'</td><td><b>'+fmt(o.vol)+'</b></td><td>'+(o.sec>0?clockLong(o.sec):'-')+'</td></tr>'});
    h+='<tr><td><b>합계</b></td><td></td><td></td><td><b>'+fmt(tv)+'</b></td><td><b>'+(tsv>0?clockLong(tsv):'-')+'</b></td></tr></table>';
  }
  if(ca.length){
    h+='<h3>유산소 운동</h3><table><tr><th>종목</th><th>운동일</th><th>누적 시간</th><th>누적 거리(km)</th><th>운동시간</th></tr>';

var chk={mode:'today',off:0};
function ds(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function md(x){return x.slice(5).replace('-','/')}

function periodRange(mode,off){
  var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),a,b,label;
  if(mode==='week'){
    a=addDays(t,-((t.getDay()+6)%7)+off*7);b=addDays(a,6);   // 월요일 시작
    label=a.getFullYear()+'.'+pad2(a.getMonth()+1)+'.'+pad2(a.getDate())+' ~ '+pad2(b.getMonth()+1)+'.'+pad2(b.getDate());
  }else if(mode==='month'){
    a=new Date(t.getFullYear(),t.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);
    label=a.getFullYear()+'년 '+(a.getMonth()+1)+'월';
  }else{
    var y=t.getFullYear()+off;a=new Date(y,0,1);b=new Date(y,11,31);label=y+'년';

function buckets(mode,R){

    o.sec+=r.sec||0;o.vol+=r.vol;o.sets+=r.sets;o.dist+=r.dist;o.min+=r.min;o.dsec+=rsec(r);o.days[r.date]=1;

  if(h3m)h+=h3m[0]+'<!--STK-->'+bars.slice(h3m[0].length);else h+='<!--STK-->'+bars;
  h+=timeline(mode,R,recs,'근력')+timeline(mode,R,recs,'유산소');
  return h;
}
function renderChk(){

}

function addEx(n,p,t,after){
  n=n.trim();p=p.trim();
  if(!n||(!p&&t!=='유산소')){toast('이름과 부위를 입력하세요');return false}
  if(findEx(n)){toast('이미 있는 종목입니다');return false}
  if(t==='유산소')p='유산소';
  else{for(var i=0;i<state.ex.length;i++){if(pkey(state.ex[i].p)===pkey(p)){p=state.ex[i].p;break}}} /* 공백만 다른 부위명은 기존 이름으로 통일 */
  state.ex.push({n:n,p:p,t:t});save();renderSet();renderEx(n);refreshParts();toast('종목을 추가했습니다');
  if(after)after();
  return true;
}

/* ===== 오늘 날짜·요일 ===== */
function pad2(n){return String(n).padStart(2,'0')}
function refreshToday(){
  var d=new Date();
  $('today').textContent=d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate())+' ('+['일','월','화','수','목','금','토'][d.getDay()]+')';
}

/* ===== 운동시간 도우미 ===== */
function tmKo(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60,a=[];if(h)a.push(h+'시간');if(m)a.push(m+'분');if(x||!a.length)a.push(x+'초');return a.join(' ')}
function tmCsv(sec){return tmKo(sec)}   /* CSV·시트 표기도 앱과 동일: 1분 20초 */
function parseTm(v){
  v=String(v==null?'':v).trim();if(!v)return 0;
  var k=v.match(/^(?:(\d+)시간)?\s*(?:(\d+)분)?\s*(?:(\d+)초)?$/);
  if(k&&(k[1]||k[2]||k[3]))return (+k[1]||0)*3600+(+k[2]||0)*60+(+k[3]||0);
  var c=v.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
  if(c)return c[3]!==undefined?(+c[1])*3600+(+c[2])*60+(+c[3]):(+c[1])*60+(+c[2]);
  return Math.round(num(v)*60);   /* 이전 CSV의 분 단위 숫자 */
}
function secSum(a){var n=0;a.forEach(function(r){n+=r.sec||0});return n}
function tmDelta(cur,prev){
  if(!(prev>0))return cur>0?'<span class="dl new">첫 기록</span>':'';
  var d=cur-prev;if(d===0)return '<span class="dl same">＝ 동일</span>';
  var r=Math.round(d/prev*100),amt=' ('+(d>0?'+':'-')+tmKo(Math.abs(d))+')';
  return d>0?'<span class="dl up">▲ +'+r+'%'+amt+'</span>':'<span class="dl down">▼ '+r+'%'+amt+'</span>';
}

/* ===== Interval 타이머 ===== */
var IVKEY='geunryeok_note_interval_v1';
var PRESETS=[[30,'30초'],[60,'1분'],[90,'1분 30초'],[120,'2분']];
var selSec=60,running=false,nextAt=0,tmr=null,actx=null,wl=null,runStart=0,lastElapsed=0;

function durLabel(sec){
  var m=Math.floor(sec/60),s=sec%60;
  if(m&&s)return m+'분 '+s+'초';
  if(m)return m+'분';
  return s+'초';
}
function clock(sec){return Math.floor(sec/60)+':'+pad2(sec%60)}
function clockLong(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad2(m)+':'+pad2(s):m+':'+pad2(s)}
function renderAcc(){var ms=running?Date.now()-runStart:lastElapsed;$('iacc').textContent=clockLong(Math.max(0,Math.floor(ms/1000)))}
function loadIv(){try{var v=JSON.parse(localStorage.getItem(IVKEY));if(v&&v.sec>=5&&v.sec<=3600)selSec=Math.round(v.sec)}catch(e){}}
function saveIv(){try{localStorage.setItem(IVKEY,JSON.stringify({sec:selSec}))}catch(e){}}

function getAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    if(!actx)actx=new AC();
    if(actx.state==='suspended'&&actx.resume)actx.resume();
    return actx;
  }catch(e){return null}
}
function beep(vol,dur){   /* vol: 소리 크기 비율(기본 1=100%), dur: 길이(초) */
  var a=getAudio();if(!a)return;
  vol=vol||1;dur=dur||0.5;
  try{
    var t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.02);
    g.gain.setValueAtTime(vol,t+dur-0.15);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function lockScreen(){
  try{if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){if(wl===l)wl=null})}).catch(function(){})}}catch(e){}
}
function unlockScreen(){try{if(wl){wl.release();wl=null}}catch(e){}}

function renderIv(){
  $('ival').textContent=durLabel(selSec);
  var run=running;
  $('ibox').className='ibox'+(run?' run':'');
  $('btnRun').className='iv-run'+(run?' on':'');
  $('btnRun').textContent=run?'■ 정지':'▶ 시작';
  $('btnRun').setAttribute('aria-pressed',run?'true':'false');
  $('cdPop').hidden=!run;
  if(run)renderCount();else{$('istate').textContent='대기 중';renderAcc()}
}
function renderCount(){
  if(!running)return;
  var rem=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
  $('istate').textContent='남은 '+clock(rem);
  $('cdNum').textContent=pad2(Math.floor(rem/60))+':'+pad2(rem%60);
  $('cdPop').className='cdpop'+(rem<=3?' warn':'');
  renderAcc();
}
var preIdx=0;   /* 이번 회차에서 이미 낸 예비 비프음 횟수 (종료 3·2·1초 전, 소리 70%) */
function tick(){
  if(!running)return;
  var now=Date.now();
  if(now>=nextAt){
    beep();   // 종료 시점: 100%
    var step=selSec*1000;
    while(nextAt<=now)nextAt+=step;
    preIdx=0;
  }else{
    var left=nextAt-now;
    while(preIdx<3&&left<=(3-preIdx)*1000){
      var due=(3-preIdx)*1000;
      if(due-left<700)beep(0.7,0.25);   // 너무 늦게 도착한 예비음은 건너뜀
      preIdx++;
    }
  }
  renderCount();
}
function startIv(){
  getAudio();
  running=true;runStart=Date.now();lastElapsed=0;nextAt=runStart+selSec*1000;preIdx=0;
  if(tmr)clearInterval(tmr);
  tmr=setInterval(tick,200);
  lockScreen();renderIv();
}
function stopIv(){
  lastElapsed=Date.now()-runStart;
  running=false;
  if(tmr){clearInterval(tmr);tmr=null}
  unlockScreen();renderIv();   // 선택한 시간(selSec)은 그대로 유지
}
function setIv(sec){
  selSec=sec;saveIv();
  if(running){nextAt=Date.now()+selSec*1000;preIdx=0}  // 실행 중 변경하면 새 시간으로 다시 시작
  renderIv();
}

function openSheet(){
  var box=$('ivOpts');box.innerHTML='';
  var isPreset=false;
  PRESETS.forEach(function(p){
    var b=document.createElement('button');b.type='button';
    b.className='opt'+(p[0]===selSec?' sel':'');if(p[0]===selSec)isPreset=true;
    b.textContent=p[1];
    b.onclick=function(){setIv(p[0]);closeSheet()};
    box.appendChild(b);
  });
  var m=document.createElement('button');m.type='button';
  m.className='opt'+(isPreset?'':' sel');
  m.textContent='수동 입력'+(isPreset?'':' ('+durLabel(selSec)+')');
  m.onclick=function(){
    $('ivM').value=Math.floor(selSec/60);$('ivS').value=selSec%60;
    $('ivManual').hidden=false;$('ivS').focus();
  };
  box.appendChild(m);
  $('ivManual').hidden=true;
  $('ivSheet').hidden=false;
}
function closeSheet(){$('ivSheet').hidden=true}

$('btnIv').onclick=openSheet;

$('ivOk').onclick=function(){
  var mm=Math.floor(num($('ivM').value)),ss=Math.floor(num($('ivS').value));
  var total=mm*60+ss;
  if(mm>60||ss>59||total<5||total>3600){toast('5초~60분 사이로 입력하세요 (초는 0~59)');return}
  setIv(total);closeSheet();
};
$('btnRun').onclick=function(){running?stopIv():startIv()};
/* 저장: 누적시간을 '지금 선택된 종목'에 붙임.
   - 그 종목의 오늘 기록이 30분 이내에 저장된 것이면 그 기록에 더함
   - 아니면 그 종목의 기록을 저장할 때 붙이도록 보관 */
function saveTime(){
  if(running)stopIv();
  var sec=Math.floor(lastElapsed/1000);
  if(sec<1){toast('저장할 누적시간이 없습니다');return}
  var e=findEx($('ex').value);
  if(!e){toast('운동 종목을 먼저 선택하세요');return}
  var t=today(),last=null;
  state.rec.forEach(function(r){if(r.ex===e.n&&r.date===t&&(!last||r.ts>last.ts))last=r});
  if(last&&Date.now()-last.ts<=30*60*1000){
    var before=last.sec||0;last.sec=before+sec;last.sent=false;
    if(!save()){last.sec=before;return}
    lastElapsed=0;renderIv();
    toast(last.ex+'에 운동시간 '+clockLong(sec)+' 저장');
    renderList();renderSum();renderChk();
    send([last],true,true);
  }else{
    if(!state.pendMap)state.pendMap={};
    var bp=state.pendMap[e.n]||0;state.pendMap[e.n]=bp+sec;
    if(!save()){if(bp)state.pendMap[e.n]=bp;else delete state.pendMap[e.n];return}
    lastElapsed=0;renderIv();
    toast('"'+e.n+'" 기록을 저장할 때 운동시간 '+clockLong(state.pendMap[e.n])+'을 붙입니다');
  }
}
$('btnSaveT').onclick=saveTime;
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){refreshToday();if(running){lockScreen();tick()}}
});
setInterval(refreshToday,60000);
loadIv();refreshToday();renderIv();

/* 세트 카운터: 누를 때마다 +1 (0~50), 길게 누르면 0으로 초기화, 앱을 닫아도 값 유지 */
var CNTKEY='geunryeok-note-counter',CNTMAX=50,cnt=0,cTimer=null,cLong=false;
try{cnt=Math.min(CNTMAX,Math.max(0,parseInt(localStorage.getItem(CNTKEY),10)||0))}catch(e){}
function renderCnt(){var b=$('btnCnt');b.textContent=cnt;b.className=cnt>=CNTMAX?'max':'';b.setAttribute('aria-label','세트 카운터 '+cnt)}
function setCnt(n){cnt=n;try{localStorage.setItem(CNTKEY,String(cnt))}catch(e){}renderCnt()}
(function(){
  var b=$('btnCnt');
  b.addEventListener('pointerdown',function(){cLong=false;clearTimeout(cTimer);cTimer=setTimeout(function(){cLong=true;if(cnt>0){setCnt(0);toast('카운터를 0으로 초기화했습니다')}if(navigator.vibrate)navigator.vibrate(30)},700)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(cTimer)})});
  b.addEventListener('click',function(){
    if(cLong){cLong=false;return}
    if(cnt>=CNTMAX){toast('최대 '+CNTMAX+'입니다 · 길게 누르면 0으로 초기화');return}
    setCnt(cnt+1);if(navigator.vibrate)navigator.vibrate(10);
  });
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
function setNavH(){var n=document.querySelector('nav'),t=$('top'),st=document.documentElement.style;if(n)st.setProperty('--navH',n.offsetHeight+'px');if(t)st.setProperty('--topH',t.offsetHeight+'px')}
setNavH();window.addEventListener('resize',setNavH);window.addEventListener('orientationchange',setNavH);window.addEventListener('load',setNavH);
load();loadView();ordLabel();refreshParts();renderCnt();
$('date').value=today();
renderEx();renderList();renderSum();renderSet();
try{var st=sessionStorage.getItem('geunryeok_tab');if(st&&st!=='in'){var bb=document.querySelector('nav button[data-t="'+st+'"]');if(bb)bb.onclick()}}catch(e){}
})();
